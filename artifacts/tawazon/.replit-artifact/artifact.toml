kind = "web"
previewPath = "/"
title = "Tawazon"
version = "1.0.0"
id = "artifacts/tawazon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21619

[services.development]
run = "pnpm --filter @workspace/tawazon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tawazon", "run", "build" ]
serve = "static"
publicDir = "artifacts/tawazon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21619"
BASE_PATH = "/"
